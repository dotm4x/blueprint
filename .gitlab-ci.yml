image: mcr.microsoft.com/dotnet/sdk:10.0

stages:
  - validate

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - when: never

variables:
  SOLUTION: "Combine.slnx"
  PACKAGE_PROJECT: "Source/Core/Combine.Core.csproj"
  PACKAGE_ID: "Combine.Core"
  NUGET_SOURCE: "https://api.nuget.org/v3/index.json"
  GIT_DEPTH: "0"

build:
  stage: validate
  script:
    - dotnet restore "$SOLUTION"
    - dotnet build "$SOLUTION" --configuration Release --no-restore

test:
  stage: validate
  script:
    - dotnet restore "$SOLUTION"
    - dotnet test "$SOLUTION" --configuration Release --no-restore

format:
  stage: validate
  script:
    - dotnet tool restore --tool-manifest dotnet-tools.json
    - dotnet csharpier check .

package:
  stage: validate
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
      else
        VERSION="1.0.0-ci.${CI_PIPELINE_IID}"
      fi

      mkdir -p "$CI_PROJECT_DIR/Build/packages"
      dotnet pack "$PACKAGE_PROJECT" \
        --configuration Release \
        -p:PackageVersion="$VERSION" \
        --output "$CI_PROJECT_DIR/Build/packages"

      PACKAGE=$(find "$CI_PROJECT_DIR/Build/packages" -maxdepth 1 -name '*.nupkg' -print -quit)
      test -n "$PACKAGE"

      PACKAGE_TEST_DIR=$(mktemp -d)
      trap 'rm -rf "$PACKAGE_TEST_DIR"' EXIT
      cd "$PACKAGE_TEST_DIR"

      dotnet new console --framework net10.0

      dotnet add package "$PACKAGE_ID" \
        --version "$VERSION" \
        --source "$CI_PROJECT_DIR/Build/packages"

      dotnet restore \
        --source "$CI_PROJECT_DIR/Build/packages" \
        --source "$NUGET_SOURCE"

      dotnet build --configuration Release --no-restore
